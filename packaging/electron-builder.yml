appId: com.lumakeys.app
productName: LumaKeys
copyright: Copyright © 2024

directories:
  output: dist
  buildResources: packaging/resources

files:
  - out/**/*
  - package.json
  - node_modules/**/*

asarUnpack:
  - node_modules/better-sqlite3/**/*

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-portable.${ext}

portable:
  requestExecutionLevel: user

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Education
  artifactName: ${productName}-${version}.${ext}

compression: normal
