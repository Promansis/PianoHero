services:
  pianohero:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pianohero
    restart: unless-stopped
    environment:
      PORT: 3001
      PIANOHERO_DATA_DIR: /data
      # Optional: require this token for /api/* until browser receives a scoped access cookie.
      # PIANOHERO_WEB_ACCESS_TOKEN: "change-this-long-random-token"
    volumes:
      - /media/storage/pianohero:/data
    ports:
      - "3001:3001"
