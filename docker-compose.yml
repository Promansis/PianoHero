services:
  lumakeys:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumakeys
    restart: unless-stopped
    environment:
      PORT: 3001
      LUMAKEYS_DATA_DIR: /data
      # Optional: require this token for /api/* until browser receives a scoped access cookie.
      # LUMAKEYS_WEB_ACCESS_TOKEN: "change-this-long-random-token"
    volumes:
      - /media/storage/lumakeys:/data
    ports:
      - "3001:3001"
